<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App - Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .back-link {
            display: inline-block;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            margin-bottom: 20px;
            transition: all 0.3s;
        }

        .back-link:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .search-section {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .search-box {
            display: flex;
            gap: 10px;
        }

        #cityInput {
            flex: 1;
            padding: 15px;
            font-size: 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            outline: none;
            transition: all 0.3s;
        }

        #cityInput:focus {
            border-color: #667eea;
        }

        #searchBtn {
            padding: 15px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s;
        }

        #searchBtn:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .weather-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: none;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .weather-card.show {
            display: block;
        }

        .current-weather {
            text-align: center;
            margin-bottom: 30px;
        }

        .city-name {
            font-size: 2.5rem;
            color: #333;
            margin-bottom: 10px;
        }

        .date {
            color: #666;
            font-size: 1rem;
            margin-bottom: 20px;
        }

        .weather-icon {
            font-size: 8rem;
            margin: 20px 0;
        }

        .temperature {
            font-size: 4rem;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .description {
            font-size: 1.5rem;
            color: #666;
            text-transform: capitalize;
            margin-bottom: 30px;
        }

        .weather-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            padding: 20px 0;
            border-top: 2px solid #e0e0e0;
        }

        .detail-item {
            text-align: center;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 10px;
        }

        .detail-icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .detail-label {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 5px;
        }

        .detail-value {
            font-size: 1.3rem;
            font-weight: bold;
            color: #333;
        }

        .forecast {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #e0e0e0;
        }

        .forecast-title {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 20px;
        }

        .forecast-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
        }

        .forecast-item {
            text-align: center;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 10px;
            transition: all 0.3s;
        }

        .forecast-item:hover {
            background: #667eea;
            color: white;
            transform: translateY(-5px);
        }

        .forecast-day {
            font-weight: 600;
            margin-bottom: 10px;
        }

        .forecast-icon {
            font-size: 2.5rem;
            margin: 10px 0;
        }

        .forecast-temp {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .loading {
            text-align: center;
            padding: 40px;
            display: none;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 2rem;
            }

            .search-box {
                flex-direction: column;
            }

            .temperature {
                font-size: 3rem;
            }

            .city-name {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../portfolio.html" class="back-link">← Back to Portfolio</a>
        
        <div class="header">
            <h1>Weather App</h1>
            <p>Real-time weather information for any city</p>
        </div>

        <div class="search-section">
            <div class="search-box">
                <input type="text" id="cityInput" placeholder="Enter city name (e.g., London, New York, Tokyo)">
                <button id="searchBtn">Search</button>
            </div>
            <div class="error-message" id="errorMessage"></div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 20px; color: white;">Fetching weather data...</p>
        </div>

        <div class="weather-card" id="weatherCard">
            <div class="current-weather">
                <h2 class="city-name" id="cityName"></h2>
                <p class="date" id="date"></p>
                <div class="weather-icon" id="weatherIcon"></div>
                <div class="temperature" id="temperature"></div>
                <div class="description" id="description"></div>
            </div>

            <div class="weather-details">
                <div class="detail-item">
                    <div class="detail-icon">💨</div>
                    <div class="detail-label">Wind Speed</div>
                    <div class="detail-value" id="windSpeed"></div>
                </div>
                <div class="detail-item">
                    <div class="detail-icon">💧</div>
                    <div class="detail-label">Humidity</div>
                    <div class="detail-value" id="humidity"></div>
                </div>
                <div class="detail-item">
                    <div class="detail-icon">🌡️</div>
                    <div class="detail-label">Feels Like</div>
                    <div class="detail-value" id="feelsLike"></div>
                </div>
                <div class="detail-item">
                    <div class="detail-icon">👁️</div>
                    <div class="detail-label">Visibility</div>
                    <div class="detail-value" id="visibility"></div>
                </div>
            </div>

            <div class="forecast">
                <h3 class="forecast-title">5-Day Forecast</h3>
                <div class="forecast-grid" id="forecastGrid"></div>
            </div>
        </div>
    </div>

    <script>
        const cityInput = document.getElementById('cityInput');
        const searchBtn = document.getElementById('searchBtn');
        const weatherCard = document.getElementById('weatherCard');
        const loading = document.getElementById('loading');
        const errorMessage = document.getElementById('errorMessage');

        // Demo data for different cities
        const weatherData = {
            'london': {
                city: 'London, GB',
                temp: 15,
                feelsLike: 13,
                description: 'partly cloudy',
                icon: '⛅',
                humidity: 72,
                windSpeed: 12,
                visibility: 10
            },
            'new york': {
                city: 'New York, US',
                temp: 22,
                feelsLike: 20,
                description: 'clear sky',
                icon: '☀️',
                humidity: 55,
                windSpeed: 8,
                visibility: 10
            },
            'tokyo': {
                city: 'Tokyo, JP',
                temp: 18,
                feelsLike: 17,
                description: 'light rain',
                icon: '🌧️',
                humidity: 85,
                windSpeed: 15,
                visibility: 8
            },
            'paris': {
                city: 'Paris, FR',
                temp: 16,
                feelsLike: 14,
                description: 'overcast clouds',
                icon: '☁️',
                humidity: 68,
                windSpeed: 10,
                visibility: 9
            },
            'sydney': {
                city: 'Sydney, AU',
                temp: 25,
                feelsLike: 24,
                description: 'sunny',
                icon: '☀️',
                humidity: 60,
                windSpeed: 14,
                visibility: 10
            },
            'default': {
                city: 'Demo City',
                temp: 20,
                feelsLike: 19,
                description: 'pleasant weather',
                icon: '🌤️',
                humidity: 65,
                windSpeed: 10,
                visibility: 10
            }
        };

        function getWeather() {
            const city = cityInput.value.trim().toLowerCase();
            if (!city) {
                showError('Please enter a city name');
                return;
            }

            loading.classList.add('show');
            weatherCard.classList.remove('show');
            errorMessage.classList.remove('show');

            // Simulate API call delay
            setTimeout(() => {
                const data = weatherData[city] || weatherData['default'];
                displayWeather(data);
                loading.classList.remove('show');
                weatherCard.classList.add('show');
            }, 1000);
        }

        function displayWeather(data) {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            
            document.getElementById('cityName').textContent = data.city;
            document.getElementById('date').textContent = now.toLocaleDateString('en-US', options);
            document.getElementById('weatherIcon').textContent = data.icon;
            document.getElementById('temperature').textContent = `${data.temp}°C`;
            document.getElementById('description').textContent = data.description;
            document.getElementById('feelsLike').textContent = `${data.feelsLike}°C`;
            document.getElementById('humidity').textContent = `${data.humidity}%`;
            document.getElementById('windSpeed').textContent = `${data.windSpeed} km/h`;
            document.getElementById('visibility').textContent = `${data.visibility} km`;

            // Generate forecast
            generateForecast(data.temp);
        }

        function generateForecast(baseTemp) {
            const forecastGrid = document.getElementById('forecastGrid');
            forecastGrid.innerHTML = '';
            
            const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];
            const icons = ['☀️', '⛅', '🌤️', '☁️', '🌧️'];

            days.forEach((day, index) => {
                const temp = baseTemp + Math.floor(Math.random() * 10) - 5;
                const icon = icons[Math.floor(Math.random() * icons.length)];
                
                const forecastItem = document.createElement('div');
                forecastItem.className = 'forecast-item';
                forecastItem.innerHTML = `
                    <div class="forecast-day">${day}</div>
                    <div class="forecast-icon">${icon}</div>
                    <div class="forecast-temp">${temp}°C</div>
                `;
                forecastGrid.appendChild(forecastItem);
            });
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            setTimeout(() => {
                errorMessage.classList.remove('show');
            }, 3000);
        }

        searchBtn.addEventListener('click', getWeather);
        cityInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') getWeather();
        });

        // Load default city on page load
        cityInput.value = 'London';
        getWeather();
    </script>
</body>
</html>
