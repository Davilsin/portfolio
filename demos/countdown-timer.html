<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer - Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .back-link {
            display: inline-block;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            margin-bottom: 20px;
            transition: all 0.3s;
        }

        .back-link:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .timer-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        .timer-display {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .time-unit {
            text-align: center;
            padding: 30px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            color: white;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .time-value {
            font-size: 4rem;
            font-weight: bold;
            display: block;
            margin-bottom: 10px;
            font-variant-numeric: tabular-nums;
        }

        .time-label {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.9;
        }

        .controls {
            max-width: 600px;
            margin: 0 auto;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 1rem;
            color: #333;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .input-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .input-wrapper {
            text-align: center;
        }

        .input-wrapper input {
            width: 100%;
            padding: 15px;
            font-size: 1.5rem;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            text-align: center;
            outline: none;
            transition: all 0.3s;
        }

        .input-wrapper input:focus {
            border-color: #667eea;
        }

        .input-wrapper span {
            display: block;
            margin-top: 5px;
            color: #666;
            font-size: 0.9rem;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-primary {
            background: #10b981;
            color: white;
        }

        .btn-primary:hover {
            background: #059669;
        }

        .btn-warning {
            background: #f59e0b;
            color: white;
        }

        .btn-warning:hover {
            background: #d97706;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .presets {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #e0e0e0;
        }

        .presets h3 {
            font-size: 1.3rem;
            color: #333;
            margin-bottom: 15px;
        }

        .preset-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
        }

        .preset-btn {
            padding: 12px 20px;
            background: #f9f9f9;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .preset-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .status-message {
            text-align: center;
            padding: 20px;
            margin-top: 20px;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: 600;
            display: none;
        }

        .status-message.show {
            display: block;
        }

        .status-message.running {
            background: #dbeafe;
            color: #1e40af;
        }

        .status-message.paused {
            background: #fef3c7;
            color: #92400e;
        }

        .status-message.finished {
            background: #dcfce7;
            color: #166534;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .alarm {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        .alarm.show {
            display: flex;
        }

        .alarm-content {
            text-align: center;
            color: white;
        }

        .alarm-icon {
            font-size: 8rem;
            margin-bottom: 20px;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .alarm-title {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .alarm-close {
            padding: 20px 40px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: 600;
            transition: all 0.3s;
        }

        .alarm-close:hover {
            background: #5568d3;
            transform: scale(1.1);
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }

            .timer-display {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }

            .time-value {
                font-size: 3rem;
            }

            .buttons {
                grid-template-columns: 1fr;
            }

            .input-row {
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../portfolio.html" class="back-link">← Back to Portfolio</a>
        
        <div class="header">
            <h1>Countdown Timer</h1>
            <p>Set custom countdowns for any event or task</p>
        </div>

        <div class="timer-card">
            <div class="timer-display">
                <div class="time-unit">
                    <span class="time-value" id="days">00</span>
                    <span class="time-label">Days</span>
                </div>
                <div class="time-unit">
                    <span class="time-value" id="hours">00</span>
                    <span class="time-label">Hours</span>
                </div>
                <div class="time-unit">
                    <span class="time-value" id="minutes">00</span>
                    <span class="time-label">Minutes</span>
                </div>
                <div class="time-unit">
                    <span class="time-value" id="seconds">00</span>
                    <span class="time-label">Seconds</span>
                </div>
            </div>

            <div class="controls">
                <div class="input-group">
                    <label>Set Your Countdown Time:</label>
                    <div class="input-row">
                        <div class="input-wrapper">
                            <input type="number" id="inputHours" min="0" max="99" value="0">
                            <span>Hours</span>
                        </div>
                        <div class="input-wrapper">
                            <input type="number" id="inputMinutes" min="0" max="59" value="0">
                            <span>Minutes</span>
                        </div>
                        <div class="input-wrapper">
                            <input type="number" id="inputSeconds" min="0" max="59" value="0">
                            <span>Seconds</span>
                        </div>
                    </div>
                </div>

                <div class="buttons">
                    <button class="btn btn-primary" id="startBtn" onclick="startTimer()">Start</button>
                    <button class="btn btn-warning" id="pauseBtn" onclick="pauseTimer()" disabled>Pause</button>
                    <button class="btn btn-danger" id="resetBtn" onclick="resetTimer()">Reset</button>
                </div>

                <div class="status-message" id="statusMessage"></div>

                <div class="presets">
                    <h3>Quick Presets:</h3>
                    <div class="preset-buttons">
                        <button class="preset-btn" onclick="setPreset(0, 1, 0)">1 Minute</button>
                        <button class="preset-btn" onclick="setPreset(0, 5, 0)">5 Minutes</button>
                        <button class="preset-btn" onclick="setPreset(0, 10, 0)">10 Minutes</button>
                        <button class="preset-btn" onclick="setPreset(0, 15, 0)">15 Minutes</button>
                        <button class="preset-btn" onclick="setPreset(0, 30, 0)">30 Minutes</button>
                        <button class="preset-btn" onclick="setPreset(1, 0, 0)">1 Hour</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Alarm Modal -->
    <div class="alarm" id="alarm">
        <div class="alarm-content">
            <div class="alarm-icon">⏰</div>
            <h2 class="alarm-title">Time's Up!</h2>
            <p style="font-size: 1.5rem; margin-bottom: 30px;">Your countdown has finished</p>
            <button class="alarm-close" onclick="closeAlarm()">Close</button>
        </div>
    </div>

    <script>
        let totalSeconds = 0;
        let remainingSeconds = 0;
        let timerInterval = null;
        let isPaused = false;

        function updateDisplay() {
            const days = Math.floor(remainingSeconds / 86400);
            const hours = Math.floor((remainingSeconds % 86400) / 3600);
            const minutes = Math.floor((remainingSeconds % 3600) / 60);
            const seconds = remainingSeconds % 60;

            document.getElementById('days').textContent = String(days).padStart(2, '0');
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
        }

        function startTimer() {
            if (timerInterval) {
                // Resume from pause
                isPaused = false;
                showStatus('Timer running...', 'running');
                updateButtons('running');
                return;
            }

            const hours = parseInt(document.getElementById('inputHours').value) || 0;
            const minutes = parseInt(document.getElementById('inputMinutes').value) || 0;
            const seconds = parseInt(document.getElementById('inputSeconds').value) || 0;

            totalSeconds = (hours * 3600) + (minutes * 60) + seconds;

            if (totalSeconds === 0) {
                alert('Please set a time greater than 0');
                return;
            }

            remainingSeconds = totalSeconds;
            updateDisplay();

            timerInterval = setInterval(() => {
                if (!isPaused) {
                    remainingSeconds--;
                    updateDisplay();

                    if (remainingSeconds <= 0) {
                        clearInterval(timerInterval);
                        timerInterval = null;
                        showAlarm();
                        showStatus('Timer finished!', 'finished');
                        updateButtons('finished');
                    }
                }
            }, 1000);

            showStatus('Timer running...', 'running');
            updateButtons('running');
        }

        function pauseTimer() {
            if (timerInterval) {
                isPaused = !isPaused;
                if (isPaused) {
                    showStatus('Timer paused', 'paused');
                    document.getElementById('pauseBtn').textContent = 'Resume';
                } else {
                    showStatus('Timer running...', 'running');
                    document.getElementById('pauseBtn').textContent = 'Pause';
                }
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
            isPaused = false;
            remainingSeconds = 0;
            updateDisplay();
            hideStatus();
            updateButtons('reset');
        }

        function setPreset(hours, minutes, seconds) {
            document.getElementById('inputHours').value = hours;
            document.getElementById('inputMinutes').value = minutes;
            document.getElementById('inputSeconds').value = seconds;
        }

        function showStatus(message, type) {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = `status-message show ${type}`;
        }

        function hideStatus() {
            document.getElementById('statusMessage').classList.remove('show');
        }

        function updateButtons(state) {
            const startBtn = document.getElementById('startBtn');
            const pauseBtn = document.getElementById('pauseBtn');
            const resetBtn = document.getElementById('resetBtn');

            if (state === 'running') {
                startBtn.disabled = true;
                pauseBtn.disabled = false;
                pauseBtn.textContent = 'Pause';
            } else if (state === 'finished' || state === 'reset') {
                startBtn.disabled = false;
                pauseBtn.disabled = true;
                resetBtn.disabled = false;
            }
        }

        function showAlarm() {
            document.getElementById('alarm').classList.add('show');
            document.body.style.overflow = 'hidden';
            
            // Play sound (browser notification)
            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification('Countdown Timer', {
                    body: 'Your countdown has finished!',
                    icon: '⏰'
                });
            }
        }

        function closeAlarm() {
            document.getElementById('alarm').classList.remove('show');
            document.body.style.overflow = 'auto';
        }

        // Request notification permission
        if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
        }

        // Initial display
        updateDisplay();
    </script>
</body>
</html>
