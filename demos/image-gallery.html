<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery - Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .back-link {
            display: inline-block;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            margin-bottom: 20px;
            transition: all 0.3s;
        }

        .back-link:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .filters {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 30px;
        }

        .filter-btn {
            padding: 12px 24px;
            background: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s;
            color: #333;
        }

        .filter-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 15px;
            cursor: pointer;
            aspect-ratio: 1;
            background: white;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: all 0.3s;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .gallery-item:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .gallery-item:hover img {
            transform: scale(1.1);
        }

        .gallery-item-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            padding: 20px;
            transform: translateY(100%);
            transition: transform 0.3s;
        }

        .gallery-item:hover .gallery-item-overlay {
            transform: translateY(0);
        }

        .gallery-item-title {
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .gallery-item-category {
            color: rgba(255,255,255,0.8);
            font-size: 0.9rem;
        }

        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .lightbox.show {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        .lightbox-content {
            position: relative;
            max-width: 90%;
            max-height: 90%;
        }

        .lightbox-image {
            max-width: 100%;
            max-height: 90vh;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .lightbox-close {
            position: absolute;
            top: -40px;
            right: 0;
            background: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5rem;
            transition: all 0.3s;
        }

        .lightbox-close:hover {
            background: #ef4444;
            color: white;
            transform: rotate(90deg);
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5rem;
            transition: all 0.3s;
        }

        .lightbox-nav:hover {
            background: #667eea;
            color: white;
        }

        .lightbox-prev {
            left: 20px;
        }

        .lightbox-next {
            right: 20px;
        }

        .lightbox-info {
            position: absolute;
            bottom: -60px;
            left: 0;
            right: 0;
            color: white;
            text-align: center;
        }

        .lightbox-title {
            font-size: 1.3rem;
            margin-bottom: 5px;
        }

        .lightbox-category {
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }

            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 15px;
            }

            .lightbox-nav {
                width: 40px;
                height: 40px;
                font-size: 1.2rem;
            }

            .lightbox-prev {
                left: 10px;
            }

            .lightbox-next {
                right: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../portfolio.html" class="back-link">← Back to Portfolio</a>
        
        <div class="header">
            <h1>Image Gallery</h1>
            <p>A beautiful, responsive photo gallery with lightbox</p>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="nature">Nature</button>
            <button class="filter-btn" data-filter="architecture">Architecture</button>
            <button class="filter-btn" data-filter="technology">Technology</button>
            <button class="filter-btn" data-filter="abstract">Abstract</button>
        </div>

        <div class="gallery" id="gallery"></div>
    </div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <div class="lightbox-content">
            <button class="lightbox-close" onclick="closeLightbox()">×</button>
            <button class="lightbox-nav lightbox-prev" onclick="navigateLightbox(-1)">‹</button>
            <img class="lightbox-image" id="lightboxImage" src="" alt="">
            <button class="lightbox-nav lightbox-next" onclick="navigateLightbox(1)">›</button>
            <div class="lightbox-info">
                <div class="lightbox-title" id="lightboxTitle"></div>
                <div class="lightbox-category" id="lightboxCategory"></div>
            </div>
        </div>
    </div>

    <script>
        const images = [
            { id: 1, src: "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=600&h=600&fit=crop", title: "Mountain Peak", category: "nature" },
            { id: 2, src: "https://images.unsplash.com/photo-1477346611705-65d1883cee1e?w=600&h=600&fit=crop", title: "Misty Forest", category: "nature" },
            { id: 3, src: "https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=600&h=600&fit=crop", title: "Lake Reflection", category: "nature" },
            { id: 4, src: "https://images.unsplash.com/photo-1480714378408-67cf0d13bc1b?w=600&h=600&fit=crop", title: "Modern Building", category: "architecture" },
            { id: 5, src: "https://images.unsplash.com/photo-1511818966892-d7d671e672a2?w=600&h=600&fit=crop", title: "City Skyline", category: "architecture" },
            { id: 6, src: "https://images.unsplash.com/photo-1487958449943-2429e8be8625?w=600&h=600&fit=crop", title: "Glass Architecture", category: "architecture" },
            { id: 7, src: "https://images.unsplash.com/photo-1518770660439-4636190af475?w=600&h=600&fit=crop", title: "Circuit Board", category: "technology" },
            { id: 8, src: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=600&h=600&fit=crop", title: "Coding Screen", category: "technology" },
            { id: 9, src: "https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=600&h=600&fit=crop", title: "Digital World", category: "technology" },
            { id: 10, src: "https://images.unsplash.com/photo-1557672172-298e090bd0f1?w=600&h=600&fit=crop", title: "Color Waves", category: "abstract" },
            { id: 11, src: "https://images.unsplash.com/photo-1557672199-6b1e6d0b3c0c?w=600&h=600&fit=crop", title: "Gradient Flow", category: "abstract" },
            { id: 12, src: "https://images.unsplash.com/photo-1558591710-4b4a1ae0f04d?w=600&h=600&fit=crop", title: "Abstract Art", category: "abstract" },
            { id: 13, src: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600&h=600&fit=crop", title: "Wild Path", category: "nature" },
            { id: 14, src: "https://images.unsplash.com/photo-1426604966848-d7adac402bff?w=600&h=600&fit=crop", title: "Green Valley", category: "nature" },
            { id: 15, src: "https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?w=600&h=600&fit=crop", title: "Beach Sunset", category: "nature" },
            { id: 16, src: "https://images.unsplash.com/photo-1479839672679-a46483c0e7c8?w=600&h=600&fit=crop", title: "Gothic Architecture", category: "architecture" },
            { id: 17, src: "https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=600&h=600&fit=crop", title: "Glass Tower", category: "architecture" },
            { id: 18, src: "https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?w=600&h=600&fit=crop", title: "Tech Innovation", category: "technology" }
        ];

        let currentFilter = 'all';
        let currentImageIndex = 0;
        let filteredImages = [...images];

        function renderGallery() {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';

            filteredImages = currentFilter === 'all' 
                ? images 
                : images.filter(img => img.category === currentFilter);

            filteredImages.forEach((image, index) => {
                const item = document.createElement('div');
                item.className = 'gallery-item';
                item.onclick = () => openLightbox(index);
                item.innerHTML = `
                    <img src="${image.src}" alt="${image.title}">
                    <div class="gallery-item-overlay">
                        <div class="gallery-item-title">${image.title}</div>
                        <div class="gallery-item-category">${image.category}</div>
                    </div>
                `;
                gallery.appendChild(item);
            });
        }

        function openLightbox(index) {
            currentImageIndex = index;
            const image = filteredImages[index];
            
            document.getElementById('lightboxImage').src = image.src;
            document.getElementById('lightboxTitle').textContent = image.title;
            document.getElementById('lightboxCategory').textContent = image.category.toUpperCase();
            document.getElementById('lightbox').classList.add('show');
            
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('show');
            document.body.style.overflow = 'auto';
        }

        function navigateLightbox(direction) {
            currentImageIndex += direction;
            
            if (currentImageIndex < 0) {
                currentImageIndex = filteredImages.length - 1;
            } else if (currentImageIndex >= filteredImages.length) {
                currentImageIndex = 0;
            }
            
            const image = filteredImages[currentImageIndex];
            document.getElementById('lightboxImage').src = image.src;
            document.getElementById('lightboxTitle').textContent = image.title;
            document.getElementById('lightboxCategory').textContent = image.category.toUpperCase();
        }

        // Filter functionality
        const filterBtns = document.querySelectorAll('.filter-btn');
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderGallery();
            });
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            const lightbox = document.getElementById('lightbox');
            if (lightbox.classList.contains('show')) {
                if (e.key === 'Escape') closeLightbox();
                if (e.key === 'ArrowLeft') navigateLightbox(-1);
                if (e.key === 'ArrowRight') navigateLightbox(1);
            }
        });

        // Close lightbox when clicking outside image
        document.getElementById('lightbox').addEventListener('click', (e) => {
            if (e.target.id === 'lightbox') {
                closeLightbox();
            }
        });

        // Initial render
        renderGallery();
    </script>
</body>
</html>
